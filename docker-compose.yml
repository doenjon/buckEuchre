# ==============================================================================
# Buck Euchre - Production Docker Compose
# ==============================================================================
# 
# This docker-compose file orchestrates all BuckEuchre services:
# - PostgreSQL database
# - Backend API server  (exposed on host port 3000)
# - Frontend web application (exposed on host port 5173)
#
# Routing (80/443) is handled by the standalone nginx-proxy stack.
# 
# ⚠️  SECURITY WARNINGS:
# - Generate strong passwords for all services
# - Use secrets management for production (AWS Secrets Manager, etc.)
# - Never commit .env files to version control
# 
# Usage:
#   docker-compose up -d                # Start all services
#   docker-compose down                 # Stop all services
#   docker-compose logs -f              # View logs
#   docker-compose ps                   # Check status
# 
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: buckeuchre-postgres
    restart: unless-stopped
    
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buckeuchre}
      POSTGRES_USER: ${POSTGRES_USER:-buckeuchre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    
    # Tuned for a small (2 GB) shared host. Postgres defaults assume it owns
    # the machine: shared_buffers alone is 128 MB per instance, and several of
    # these stacks run side by side. Keep each instance small and let the host
    # page cache do the caching.
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=128MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - work_mem=2MB
      - -c
      - max_connections=20
      - -c
      - max_worker_processes=2
      - -c
      - max_parallel_workers=0
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_parallel_maintenance_workers=0
      - -c
      - autovacuum_max_workers=1
      - -c
      - max_wal_size=512MB
      - -c
      - min_wal_size=80MB
    mem_limit: 256m
    
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buckeuchre}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    networks:
      - buckeuchre-internal
    
    ports:
      - "5432:5432"

  # ----------------------------------------------------------------------------
  # Backend API Server
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: buckeuchre-backend
    restart: unless-stopped
    
    depends_on:
      postgres:
        condition: service_healthy
    
    environment:
      NODE_ENV: production
      # Without this Node derives its heap ceiling from host RAM and
      # defers major GCs far longer than a 2 GB shared box can afford.
      NODE_OPTIONS: --max-old-space-size=192
      UV_THREADPOOL_SIZE: 2
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WS_HEARTBEAT_INTERVAL: ${WS_HEARTBEAT_INTERVAL:-30000}
      WS_GRACE_PERIOD: ${WS_GRACE_PERIOD:-30000}
    
    command: >
      sh -c "npx prisma migrate deploy &&
             node dist/index.js"
    
    mem_limit: 384m
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 10s
    
    networks:
      - buckeuchre-internal
      - buckeuchre-web
    
    # Exposed to host so nginx-proxy can route to it
    ports:
      - "3000:3000"

  # ----------------------------------------------------------------------------
  # Frontend Web Application
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: buckeuchre-frontend
    restart: unless-stopped
    
    mem_limit: 64m
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 5s
    
    # Exposed to host so nginx-proxy can route to it
    # Bind to 0.0.0.0 so host.docker.internal resolves correctly from nginx-proxy container
    # (AWS security groups block external access to this port)
    ports:
      - "5173:80"

# ------------------------------------------------------------------------------
# Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres-data:
    driver: local

# ------------------------------------------------------------------------------
# Networks
# ------------------------------------------------------------------------------
networks:
  # Internal network (database ↔ backend only, no external access)
  buckeuchre-internal:
    driver: bridge
    internal: true
  # Web-accessible network for backend port exposure to host nginx-proxy
  buckeuchre-web:
    driver: bridge
